name = "yearn-artifacts"
main = "src/index.ts"
compatibility_date = "2026-08-08"
workers_dev = true

routes = [
  { pattern = "artifacts.yearn.dev", custom_domain = true }
]

# Reads are unauthenticated (see AGENTS.md). If that changes, put a
# Cloudflare Access application in front of this hostname.

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "artifacts"

[browser]
binding = "BROWSER"
remote = true

[observability]
[observability.logs]
enabled = true
invocation_logs = true
